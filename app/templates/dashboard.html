<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<title>BLOCERA Yönetim Paneli</title>


<style>

body{
    font-family: Arial, sans-serif;
    padding:40px;
}


h1{
    font-size:35px;
}


table{

    width:100%;
    border-collapse:collapse;
    margin-top:30px;

}


th{

    background:#111;
    color:white;
    padding:15px;
    text-align:center;

}


td{

    border:1px solid #ddd;
    padding:15px;
    text-align:center;

}


tr:nth-child(even){

    background:#f5f5f5;

}


</style>


</head>


<body>


<h1>GELEN TALEPLER</h1>


<table>


<thead>

<tr>

<th>AD SOYAD</th>

<th>FİRMA ADI</th>

<th>TELEFON</th>

<th>E-MAİL</th>

<th>MESAJ</th>

<th>DURUM</th>

</tr>


</thead>



<tbody id="talepListesi">


</tbody>



</table>




<script>


async function talepleriGetir(){


    const cevap = await fetch("/api/leads");


    const veri = await cevap.json();



    const tablo =
    document.getElementById("talepListesi");



    tablo.innerHTML="";



    veri.leadler.forEach(
        
        function(lead){
            console.log(lead);
 


            tablo.innerHTML += `


        <tr>

       <td>${lead.ad_soyad || lead.isim || "Test Kullanıcı"}</td>

       <td>${lead.firma_adi || "-"}</td>

       <td>${lead.telefon || "-"}</td>

       <td>${lead.e_posta || "-"}</td>

       <td>${lead.mesaj || "-"}</td>

       <td>${lead.durum || "Yeni"}</td>
        </tr>


        `;


        }


    );



}



talepleriGetir();



</script>



</body>


</html>
